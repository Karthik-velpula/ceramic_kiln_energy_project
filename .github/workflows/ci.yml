name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Train and verify non-negative predictions
        run: |
          python -m kiln_energy.pipeline
          python -c "import joblib,pandas as pd; from kiln_energy.features import engineer_features; x=pd.read_csv('data/kiln_batches_v1.csv').head(5); m=joblib.load('artifacts/model.joblib'); assert (m.predict(engineer_features(x)) >= 0).all()"
